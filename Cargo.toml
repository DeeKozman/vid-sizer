[package]
name = "vid-sizer"
version = "0.1.0"
edition = "2024"
description = "Resize, convert, crop and edit video with ffmpeg"
authors = ["Dan Koscielak"]

[dependencies]
cpal = "0.18.2"
eframe = "0.36.2"
egui = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
winresource = "0.1.31"
